<section class="gallery">
    <h1>Our Work</h1>
    <p>Check out some of the recent cars we’ve detailed!</p>
  
    <div class="gallery-grid">
      <div class="gallery-item" *ngFor="let img of [1, 2, 3, 4, 5, 6]">
        <img src="https://via.placeholder.com/300x200?text=Car+{{ img }}" alt="Gallery image {{ img }}">
      </div>
    </div>
  </section>
