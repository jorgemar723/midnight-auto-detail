<section class="contact">
  <h1>Contact Us</h1>
  <p>Have a question or want to book an appointment? Send us a message!</p>

  <form (ngSubmit)="onSubmit()" #contactForm="ngForm" class="contact-form">
    <label for="name">Name:</label>
    <input type="text" id="name" required [(ngModel)]="name" name="name" />

    <label for="email">Email:</label>
    <input type="email" id="email" required [(ngModel)]="email" name="email" />

    <label for="message">Message:</label>
    <textarea id="message" rows="5" required [(ngModel)]="message" name="message"></textarea>

    <button type="submit" [disabled]="!contactForm.valid || submitState === 'sending'">
      {{ submitState === 'sending' ? 'Sending…' : 'Send Message' }}
    </button>
  </form>

  <div *ngIf="submitState === 'success'" style="margin-top:12px;">
    Thanks for reaching out. We’ll get back to you shortly.
  </div>

  <div *ngIf="submitState === 'error'" style="margin-top:12px;">
    Sorry, something went wrong sending your message. Please try again in a moment.
  </div>
</section>
