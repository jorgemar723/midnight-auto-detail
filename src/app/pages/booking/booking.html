<main class="booking">
    <h2>Book Your Appointment</h2>
    <form class="booking-form">
      <div>
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="John Doe" required />
      </div>
  
      <div>
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="john@example.com" required />
      </div>
  
      <div>
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="(123) 456-7890" required />
      </div>
  
      <div>
        <label for="make">Car Make</label>
        <select id="make" name="make" required>
          <option value="" disabled selected>Select Make</option>
          <option value="Toyota">Toyota</option>
          <option value="Honda">Honda</option>
          <option value="Ford">Ford</option>
          <option value="Chevrolet">Chevrolet</option>
          <option value="Nissan">Nissan</option>
          <!-- Add more as needed -->
        </select>
      </div>
  
      <div>
        <label for="model">Car Model</label>
        <input type="text" id="model" name="model" placeholder="Civic, Camry, F-150..." required />
      </div>
  
      <div>
        <label for="year">Car Year</label>
        <select id="year" name="year" required>
          <option value="" disabled selected>Select Year</option>
          <!-- Generate years dynamically if needed -->
          <script>
            const select = document.currentScript.parentElement.querySelector('select');
            const year = new Date().getFullYear();
            for (let i = year; i >= 1980; i--) {
              const option = document.createElement('option');
              option.value = i;
              option.textContent = i;
              select.appendChild(option);
            }
          </script>
        </select>
      </div>
  
      <div>
        <label for="color">Car Color</label>
        <input type="text" id="color" name="color" placeholder="Black, Red, White..." required />
      </div>
  
      <div>
        <label for="notes">Additional Notes</label>
        <textarea id="notes" name="notes" placeholder="Any special requests?"></textarea>
      </div>
  
      <button type="submit">Submit Booking</button>
    </form>
  </main>
